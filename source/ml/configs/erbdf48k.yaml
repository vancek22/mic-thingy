# ERB-band gains + deep filtering (se/models/erbdf.py). Same data as nsnet48k.yaml so the two compare directly.
# LibriSpeech is 16 kHz: the bands span 0-7.2 kHz and the bins above copy the 5-7 kHz gain. For real full-band
# control train on full-band speech (dns48k.yaml data section) with speech_max_hz: 0.
# Stage 1 alone: python train.py configs/erbdf48k.yaml model.df_order=0 train.out_dir=runs/erb48k
data:
  sample_rate: 48000
  segment_s: 2.0
  speech_dirs: [data/LibriSpeech/train-clean-100, data/LibriSpeech/dev-clean]
  val_speech_dirs: [data/LibriSpeech/test-clean]
  noise_dirs: [data/RIRS_NOISES/pointsource_noises, data/demand_train]
  val_noise_dirs: [data/demand_val]
  rir_dirs: [data/RIRS_NOISES/real_rirs_isotropic_noises, data/RIRS_NOISES/simulated_rirs]
  real_dirs: [data/real]
  speech_max_hz: 8000
  p_synth_noise: 0.35
  num_workers: 8
stft: {n_fft: 960, hop: 480, window: vorbis}
model: {name: erbdf, hidden: 128, bands: 32, df_max_hz: 4800, df_order: 5, conv_ch: 16, hf_lo_hz: 5000, hf_hi_hz: 7000}
loss: {w_mrstft: 1.0, w_sisdr: 0.02, w_spec: 1.0, w_vad: 0.1}
train: {out_dir: runs/erbdf48k, steps: 40000, batch: 32, lr: 0.002}
