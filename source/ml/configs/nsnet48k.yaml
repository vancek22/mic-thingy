# The model mic thingy runs in C (src/dsp/nn.c): GRU mask over 50 Hz bins + speech-presence head.
# export_c.py turns its checkpoint into src/dsp/nn_weights.c.
data:
  sample_rate: 48000
  segment_s: 2.0
  speech_dirs: [data/LibriSpeech/train-clean-100, data/LibriSpeech/dev-clean]
  val_speech_dirs: [data/LibriSpeech/test-clean]
  noise_dirs: [data/RIRS_NOISES/pointsource_noises, data/demand_train]
  val_noise_dirs: [data/demand_val]
  rir_dirs: [data/RIRS_NOISES/real_rirs_isotropic_noises, data/RIRS_NOISES/simulated_rirs]
  real_dirs: [data/real]
  speech_max_hz: 8000
  p_synth_noise: 0.35
  num_workers: 8
stft: {n_fft: 960, hop: 480, window: vorbis}
model: {name: nsnet, hidden: 128, bins: 145, hf_lo_hz: 5000, hf_hi_hz: 7000}
loss: {w_mrstft: 1.0, w_sisdr: 0.02, w_spec: 1.0, w_vad: 0.1}
train: {out_dir: runs/nsnet48k, steps: 40000, batch: 32, lr: 0.002}
