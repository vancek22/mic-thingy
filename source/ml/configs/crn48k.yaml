# Causal CRN, 48 kHz, 20 ms window / 10 ms hop (10 ms algorithmic latency), complex mask.
# Data: the "small" set from download_data.py (LibriSpeech + OpenSLR 28 noises/RIRs + synthetic noise).
data:
  sample_rate: 48000
  segment_s: 2.0
  speech_dirs: [data/LibriSpeech/train-clean-100, data/LibriSpeech/dev-clean]
  val_speech_dirs: [data/LibriSpeech/test-clean]
  noise_dirs: [data/RIRS_NOISES/pointsource_noises, data/demand_train]
  val_noise_dirs: [data/demand_val]
  rir_dirs: [data/RIRS_NOISES/real_rirs_isotropic_noises, data/RIRS_NOISES/simulated_rirs]
  real_dirs: [data/real]
  speech_max_hz: 8000        # LibriSpeech is 16 kHz: the model sees/predicts 0-7.2 kHz, the rest follows 5-7 kHz
  p_synth_noise: 0.35
  num_workers: 8
stft: {n_fft: 960, hop: 480, window: vorbis}
model:
  name: crn
  channels: [16, 32, 48, 64]
  rnn_hidden: 256
  rnn_layers: 2
  mask: complex
loss: {w_mrstft: 1.0, w_sisdr: 0.02, w_spec: 1.0}
train:
  out_dir: runs/crn48k
  steps: 60000
  batch: 16
  lr: 0.001
