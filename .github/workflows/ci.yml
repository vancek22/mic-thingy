name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          mkdir -p dist/mic-thingy
          cp build/mic-thingy.exe build/mic-thingy-cli.exe build/mic-thingy-file.exe dist/mic-thingy/
          cp README.md README.pl.md LICENSE THIRD_PARTY_NOTICES.md dist/mic-thingy/
      - uses: actions/upload-artifact@v4
        with:
          name: mic-thingy-windows
          path: dist/mic-thingy

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libpipewire-0.3-dev libasound2-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          mkdir -p dist/mic-thingy
          cp build/mic-thingy build/mic-thingy-cli build/mic-thingy-file dist/mic-thingy/
          cp README.md README.pl.md LICENSE THIRD_PARTY_NOTICES.md dist/mic-thingy/
          tar -C dist -czf mic-thingy-linux.tar.gz mic-thingy
      - uses: actions/upload-artifact@v4
        with:
          name: mic-thingy-linux
          path: mic-thingy-linux.tar.gz
